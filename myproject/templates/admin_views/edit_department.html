{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white py-3 fw-bold">
                <i class="bi bi-pencil-square me-2"></i>Edit Department: {{ department.name }}
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Department Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Update Department</button>
                        <a href="{% url 'manage_departments' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
