{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white py-3 fw-bold">
                <i class="bi bi-pencil-square me-2"></i>Update Doctor: {{ doctor.name }}
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Doctor Full Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Department</label>
                        {{ form.department }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Specialization</label>
                        {{ form.specialization }}
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contact Number</label>
                            {{ form.contact_number }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Consultation Fee (₹)</label>
                            {{ form.consultation_fee }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Schedule</label>
                        {{ form.schedule }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Save Changes</button>
                        <a href="{% url 'manage_doctors' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
